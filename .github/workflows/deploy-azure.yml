# Build this fork's code into an image and roll it onto the Azure VM.
#
# Upstream's docker.yml publishes the official nousresearch/hermes-agent image and
# is gated on `github.repository == 'NousResearch/hermes-agent'`, so it never runs
# here. This workflow is the fork's own path to production and is gated the same
# way so it never runs upstream or on a fork-of-this-fork.
#
# Auth to Azure is OIDC (no stored credentials). The VM is reached through
# `az vm run-command`, so no inbound SSH port has to be opened for CI.
name: Deploy to Azure

on:
  push:
    branches: [main]
    # The Dockerfile ends in `COPY --link . .`, so almost every tracked file
    # lands in the image and a change to it is a real change to production.
    # Every entry below is either already excluded by .dockerignore, so it
    # cannot alter the image at all, or one of two exceptions that do reach the
    # image but nothing at runtime reads: azure-deploy/ (host-side tooling that
    # provisions and drives the VM from outside the container) and LICENSE.
    #
    # Deliberately NOT ignored:
    #   - skills/**, and markdown outside the repo root generally. .dockerignore's
    #     `*.md` only matches root-level files, so nested markdown is in the image
    #     and skills/ markdown is executable content, not documentation.
    #   - .github/**, so a change to this workflow still gets exercised.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'website/**'
      - 'tests/**'
      - 'assets/**'
      - 'infographic/**'
      - 'packaging/**'
      - 'plans/**'
      - '.plans/**'
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'azure-deploy/**'
      - 'LICENSE'
      - '.gitattributes'
      - '.mailmap'
      - '.hadolint.yaml'
      - '.envrc'
      - '.env.example'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

# Never run two deploys at once, and never cancel one midway: a cancelled deploy
# can leave the VM between containers.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  RG: hermes-agent-rg
  VM: hermes-vm
  SITE: https://hermes-sdn.southeastasia.cloudapp.azure.com

jobs:
  deploy:
    if: github.repository == 'cabindev/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The image is ~4 GB and the build unpacks several toolchains on top of
      # that; a stock runner does not have room for it.
      - name: Free up runner disk
        run: |
          echo "before: $(df -h / | awk 'NR==2{print $4}') free"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          echo "after:  $(df -h / | awk 'NR==2{print $4}') free"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only: the target is a single Standard_B2s VM, so building
      # arm64 too would roughly double the build for an artifact nothing pulls.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # `az vm run-command invoke` exits 0 even when the script it ran failed,
      # so the VM-side success marker is what this step actually gates on.
      # hermes-deploy.sh health-checks the new container and rolls back to the
      # previous image if it does not come up.
      - name: Roll the VM onto the new image
        run: |
          set -euo pipefail
          out=$(az vm run-command invoke \
            -g "$RG" -n "$VM" \
            --command-id RunShellScript \
            --scripts "sudo /usr/local/bin/hermes-deploy.sh ${IMAGE}:${GITHUB_SHA}" \
            --query "value[0].message" -o tsv)
          echo "$out"
          if ! grep -q '\[hermes-deploy\] deploy OK' <<<"$out"; then
            echo "::error::VM-side deploy failed (see output above)"
            exit 1
          fi

      - name: Verify the public endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE/login" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$SITE/login never returned 200"
          exit 1
